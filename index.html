<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<title>Lagerboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128230;</text></svg>" />
<style>
/* ---------------------------------------------------------------
   Lagerboard — visuelles System
   Grundgedanke: Werkzeug für die Lagerhalle. Auf Armlänge lesbar,
   auch bei schlechtem Licht. Ruhige Fläche, klare Kanten, Farbe
   nur dort wo sie eine Bedeutung trägt: Status und Signal.
   --------------------------------------------------------------- */
:root{
  /* Flächen: kühles Anthrazit, leicht blaustichig wie lackierter Stahl */
  --bg:#0b0e13;
  --bg2:#0e1218;
  --surface:#12171f;
  --surface2:#161c26;
  --raised:#1a212c;

  /* Schrift */
  --fg:#eef2f7;
  --dim:#9aa7b8;
  --dim2:#6b7887;
  --dim3:#48535f;

  /* Kanten */
  --line:#212a36;
  --line2:#2e3a49;
  --line3:#3d4b5c;

  /* Signal: Bernstein wie Hallenbeleuchtung und Staplerwarnleuchte */
  --acc:#f0a830;
  --acc-dim:rgba(240,168,48,.13);
  --acc-line:rgba(240,168,48,.42);
  --acc-txt:#ffcf7a;

  /* Statusfarben */
  --em:#3ecf8e; --am:#f0a830; --ro:#f2555a; --sk:#4aa8ff;

  --r:10px;    /* Radius klein */
  --r2:14px;   /* Radius Karte */
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
::selection{background:var(--acc-dim);color:var(--acc-txt)}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:
  radial-gradient(1200px 600px at 50% -200px, #141b26 0%, transparent 70%), var(--bg);
  background-attachment:fixed;
  font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-feature-settings:"cv05","ss01";
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
@media(max-width:560px){.wrap{padding:0 14px}}

/* ---------- Kopfzeile ---------- */
header{position:sticky;top:0;z-index:20;
  background:linear-gradient(to bottom,rgba(11,14,19,.98),rgba(11,14,19,.92));
  backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 0 12px}
.logo{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r);
  background:linear-gradient(160deg,var(--raised),var(--surface));
  border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.logo svg{width:19px;height:19px;color:var(--acc)}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.sub{font-size:12px;color:var(--dim2);margin:2px 0 0;letter-spacing:.01em;
  font-variant-numeric:tabular-nums}

/* Reiter: unterstrichen statt Pillen — ruhiger, wirkt weniger nach Spielzeug */
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:0;background:none;
  color:var(--dim2);font:500 13.5px/1 inherit;letter-spacing:.005em;
  padding:11px 13px 12px;cursor:pointer;position:relative;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .15s}
nav button svg{width:15px;height:15px;opacity:.75}
nav button:hover{color:var(--dim)}
nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
nav button.on svg{opacity:1;color:var(--acc)}
main{padding:22px 0 110px}

/* ---------- Karten ---------- */
section.card{border:1px solid var(--line);border-radius:var(--r2);
  background:linear-gradient(to bottom,var(--surface),var(--bg2));
  box-shadow:var(--sh);overflow:hidden}
.pad{padding:14px 16px}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.hd .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd svg{color:var(--dim2)}
.stack>*+*{margin-top:14px}
.stack4>*+*{margin-top:18px}

/* ---------- Typografie ---------- */
.muted{color:var(--dim2);font-size:13.5px}
.tiny{color:var(--dim3);font-size:11.5px;font-variant-numeric:tabular-nums}
.up{display:block;font-size:10.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.09em;color:var(--dim2)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- Eingaben ---------- */
input,select,textarea{font:inherit;color:var(--fg)}
.f{width:100%;border:1px solid var(--line2);background:#0a0d12;border-radius:var(--r);
  padding:10px 13px;font-size:14.5px;outline:none;transition:border-color .15s,box-shadow .15s}
.f:hover{border-color:var(--line3)}
.f:focus{border-color:var(--acc-line);box-shadow:0 0 0 3px var(--acc-dim)}
.f::placeholder{color:var(--dim3)}
select.f{appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim2) 50%),linear-gradient(135deg,var(--dim2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 51%,calc(100% - 12px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.inl{width:100%;background:none;border:0;outline:none;padding:7px 6px;font-size:14.5px;
  color:var(--fg);border-radius:6px;transition:background .12s,box-shadow .12s}
.inl:hover{background:rgba(255,255,255,.03)}
.inl:focus{background:#0a0d12;box-shadow:0 0 0 1px var(--acc-line)}
.inl::placeholder{color:var(--dim3)}
textarea.f{line-height:1.55}

/* ---------- Schaltflächen ---------- */
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line2);background:linear-gradient(to bottom,var(--raised),var(--surface2));
  color:var(--dim);border-radius:var(--r);padding:9px 14px;font-size:13.5px;font-weight:550;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:all .14s}
.btn:hover{border-color:var(--line3);color:var(--fg)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.pri{background:linear-gradient(to bottom,#f5b649,var(--acc));color:#231603;
  border-color:#c98a20;font-weight:650;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 3px rgba(0,0,0,.4)}
.btn.pri:hover{filter:brightness(1.07);color:#231603}
.btn.dan{color:var(--ro)}
.btn.dan:hover{border-color:rgba(242,85,90,.5);background:rgba(242,85,90,.1)}
.btn[disabled]{opacity:.35;cursor:default;transform:none}
.btn.w{width:100%;justify-content:center}
.dash{width:100%;border:1px dashed var(--line3);border-radius:var(--r2);background:none;
  color:var(--dim2);padding:15px;font-weight:550;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:all .15s}
.dash:hover{border-color:var(--acc-line);color:var(--acc-txt);background:rgba(240,168,48,.04)}
.dash svg{width:16px;height:16px}
.iconbtn{border:0;background:none;color:var(--dim3);padding:7px;border-radius:7px;line-height:0;
  transition:all .13s}
.iconbtn:hover{background:rgba(242,85,90,.12);color:var(--ro)}
.iconbtn svg{width:15px;height:15px}

/* ---------- Layout ---------- */
.row{display:flex;align-items:center;gap:9px}
.wrapf{display:flex;flex-wrap:wrap;gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}

/* Kennzahl-Kacheln: die Zahl trägt, das Etikett ordnet sich unter */
.tile{border:1px solid var(--line);border-radius:var(--r2);
  background:linear-gradient(to bottom,var(--surface),var(--bg2));
  padding:12px 14px 11px;text-align:left;color:var(--fg);
  box-shadow:var(--sh);transition:all .15s;position:relative;overflow:hidden}
.tile:hover{border-color:var(--line3)}
.tile.on{border-color:var(--acc-line);background:linear-gradient(to bottom,#1c1c16,var(--bg2))}
.tile.on::before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--acc)}
.tile b{display:block;font-size:26px;font-weight:640;letter-spacing:-.03em;line-height:1.05;
  font-variant-numeric:tabular-nums;margin-bottom:5px}
.tile span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim2);
  font-weight:500;letter-spacing:.01em}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}

/* Status-Marken */
.chip{border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px;
  font-weight:550;background:var(--surface2);color:var(--dim2);
  display:inline-flex;align-items:center;gap:5px;transition:all .13s;letter-spacing:.005em}
.chip:hover{border-color:var(--line3);color:var(--dim)}
.chip.on{color:#fff}

/* ---------- Tabelle ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);
  background:linear-gradient(to bottom,var(--surface),var(--bg2));box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--dim2);font-weight:650;padding:11px 12px;white-space:nowrap;
  background:rgba(255,255,255,.02);border-bottom:1px solid var(--line2)}
td{padding:3px 6px;border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.022)}
td .inl{padding:8px}

.divide>*+*{border-top:1px solid var(--line)}

/* ---------- Fortschritt ---------- */
.bar{height:6px;width:100%;border-radius:99px;background:#0a0d12;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#d4901f,var(--acc));transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar>i.done{background:linear-gradient(90deg,#2fae76,var(--em))}

.chk{width:19px;height:19px;flex:0 0 auto;border:1px solid var(--line3);border-radius:6px;
  background:#0a0d12;display:flex;align-items:center;justify-content:center;padding:0;
  color:transparent;transition:all .14s}
.chk:hover{border-color:var(--dim2)}
.chk.on{border-color:var(--em);background:rgba(62,207,142,.16);color:var(--em)}
.chk svg{width:12px;height:12px}

/* ---------- Hinweisleiste ---------- */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;
  border:1px solid var(--line);border-left:3px solid var(--line3);
  border-radius:var(--r);background:var(--surface);padding:11px 14px}
.banner.warn{border-color:rgba(240,168,48,.3);border-left-color:var(--acc);
  background:linear-gradient(to right,rgba(240,168,48,.07),rgba(240,168,48,.02))}
.banner svg{width:16px;height:16px}

/* ---------- Layout-Fläche ---------- */
.layboard{position:relative;width:100%;aspect-ratio:16/9;min-height:280px;
  border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;
  background:
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/100% 5%,
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/5% 100%,
    linear-gradient(to bottom,var(--surface),var(--bg2));
  box-shadow:var(--sh);touch-action:none}
.layhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim3);font-size:13.5px;margin:0;pointer-events:none}
.lf{position:absolute;border:1px solid var(--line3);border-radius:8px;
  background:linear-gradient(to bottom,var(--raised),var(--surface2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 6px;gap:1px;cursor:grab;overflow:hidden;user-select:none;
  box-shadow:0 2px 6px rgba(0,0,0,.35);transition:border-color .13s,box-shadow .13s}
.lf:hover{border-color:var(--dim2)}
.lf.full{border-color:var(--acc-line);
  background:linear-gradient(to bottom,#241d10,#191410)}
.lf.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-dim),0 4px 12px rgba(0,0,0,.5);
  cursor:grabbing;z-index:5}
.lf-n{font-size:11.5px;font-weight:600;color:var(--fg);line-height:1.15;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.lf-a{font-size:10.5px;color:var(--acc-txt);line-height:1.15;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
@media(max-width:560px){.layboard{aspect-ratio:4/3}}

.ico{width:16px;height:16px;flex:0 0 auto;display:inline-block;vertical-align:-3px}
.hide{display:none}
.center{min-height:60vh;display:flex;align-items:center;justify-content:center;
  color:var(--dim2);gap:9px;font-size:14px}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sanfter Auftritt beim Reiterwechsel */
main>.wrap>div{animation:in .22s cubic-bezier(.2,0,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
@media(max-width:560px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .tile b{font-size:22px}
  .hrow{padding:12px 0 10px}
  main{padding:16px 0 90px}
  .pad{padding:12px 13px}
  .hd{padding:11px 13px}
}
</style>
</head>

<div id="root"><div class="center">Lagerboard wird geladen…</div></div>

<script>
"use strict";
/* =========================================================================
   Lagerboard – eigenständige Fassung
   Keine externen Bibliotheken, keine Internet-Verbindung nötig.
   Läuft hinter Firewall und VPN.
   ========================================================================= */

/* ---------------- kleine Helfer ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const de = (n) => Number(n).toLocaleString("de-DE");

const clock = (ts) => !ts ? "—" :
  new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const stamp = (ts) => !ts ? "—" :
  new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit",
    year: "numeric", hour: "2-digit", minute: "2-digit" });
const ago = (ts, now) => {
  if (!ts) return "";
  const m = Math.floor((now - ts) / 60000);
  if (m < 1) return "gerade eben";
  if (m < 60) return "vor " + m + " Min.";
  const h = Math.floor(m / 60);
  if (h < 24) return "vor " + h + " Std.";
  const d = Math.floor(h / 24);
  return d === 1 ? "vor 1 Tag" : "vor " + d + " Tagen";
};
const STALE_H = 8;

/* Zahl aus deutscher oder englischer Schreibweise.
   Heikel ist der einzelne Punkt: "1.250" ist deutsch 1250, englisch 1,25.
   Regel: Punkt mit genau drei Ziffern dahinter und kein Komma im Text
   -> Tausenderpunkt. Sonst Dezimalpunkt. */
const num = (v) => {
  let s = String(v == null ? "" : v).trim().replace(/\s/g, "");
  if (!s) return 0;
  s = s.replace(/[^0-9.,\-]/g, "");
  if (!s) return 0;
  const hasC = s.indexOf(",") > -1, dots = (s.match(/\./g) || []).length;
  if (hasC && dots) s = s.replace(/\./g, "").replace(",", ".");        /* 1.234,56 */
  else if (hasC) s = s.replace(",", ".");                              /* 1,5 */
  else if (dots > 1) s = s.replace(/\./g, "");                         /* 1.234.567 */
  else if (dots === 1 && /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(".", ""); /* 1.250 */
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

const STATUS = [
  { id: "frei",     label: "Frei",     col: "var(--em)" },
  { id: "belegt",   label: "Belegt",   col: "var(--am)" },
  { id: "gesperrt", label: "Gesperrt", col: "var(--ro)" },
  { id: "fertig",   label: "Fertig",   col: "var(--sk)" }
];
const PRIO = [
  { id: "hoch",    label: "Hoch",    col: "var(--ro)" },
  { id: "normal",  label: "Normal",  col: "var(--sk)" },
  { id: "niedrig", label: "Niedrig", col: "var(--dim)" }
];

/* Euro-/Einwegpalettenlager erkennen, auch bei abweichender Schreibweise */
const isPal = (v) => {
  const s = String(v || "").toLowerCase().replace(/[\s.\-_]/g, "");
  return s.indexOf("europalett") > -1 || s.indexOf("euopalett") > -1 ||
         s.indexOf("einwegpalett") > -1 || s.indexOf("einwegpal") > -1 ||
         s === "euro" || s === "einweg";
};

/* ---------------- Symbole (inline) ---------------- */
const SVG = {
  box:'<path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  sheet:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h8"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',

/* =========================================================================
   XLSX-/CSV-Leser (eigenbau)
   xlsx ist ein ZIP-Archiv. Der Browser kann deflate seit einigen Jahren
   selbst entpacken (DecompressionStream), daher brauchen wir keine Bibliothek.
   ========================================================================= */

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "undefined")
    throw new Error("Dieser Browser ist zu alt für .xlsx. Bitte die Datei in Excel als CSV speichern.");
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* ZIP entpacken: liefert { dateiname: Uint8Array } */
async function unzip(buf) {
  const d = new DataView(buf), u = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u.length - 22; i >= 0 && i > u.length - 66000; i--) {
    if (d.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Keine gültige Excel-Datei.");
  const count = d.getUint16(eocd + 10, true);
  let p = d.getUint32(eocd + 16, true);
  const out = {};
  for (let n = 0; n < count; n++) {
    if (d.getUint32(p, true) !== 0x02014b50) break;
    const method = d.getUint16(p + 10, true);
    const csize  = d.getUint32(p + 20, true);
    const nlen   = d.getUint16(p + 28, true);
    const elen   = d.getUint16(p + 30, true);
    const clen   = d.getUint16(p + 32, true);
    const lho    = d.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(u.subarray(p + 46, p + 46 + nlen));
    const lnlen  = d.getUint16(lho + 26, true);
    const lelen  = d.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    const raw    = u.subarray(start, start + csize);
    if (name.indexOf("xl/") === 0 || name.indexOf("sheet") > -1) {
      out[name] = method === 0 ? raw : await inflateRaw(raw);
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}

const dec = (b) => new TextDecoder("utf-8").decode(b);
const unesc = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">")
  .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (m, c) =>
    String.fromCharCode(+c)).replace(/&amp;/g, "&");

/* Spaltenbuchstabe -> Index: A=0, B=1, AA=26 */
const colIdx = (ref) => {
  const m = /^([A-Z]+)/.exec(ref || "");
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};

/* Ein Tabellenblatt in ein Raster aus Text umwandeln */
function sheetToGrid(xml, shared) {
  const rows = [];
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>|<row[^>]*\/>/g;
  let r;
  while ((r = rowRe.exec(xml))) {
    const inner = r[1] || "";
    const cells = [];
    const cRe = /<c([^>]*)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let c;
    while ((c = cRe.exec(inner))) {
      const attr = c[1] || "", body = c[2] || "";
      const refM = /r="([A-Z]+\d+)"/.exec(attr);
      const idx = refM ? colIdx(refM[1]) : cells.length;
      const type = (/t="([^"]+)"/.exec(attr) || [])[1] || "";
      let val = "";
      if (type === "inlineStr") {
        const t = body.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
        val = t.map((x) => x.replace(/<[^>]+>/g, "")).join("");
      } else {
        const v = /<v[^>]*>([\s\S]*?)<\/v>/.exec(body);
        val = v ? v[1] : "";
        if (type === "s") val = shared[+val] != null ? shared[+val] : "";
      }
      while (cells.length < idx) cells.push("");
      cells[idx] = unesc(val);
    }
    rows.push(cells);
  }
  return rows;
}

/* sharedStrings.xml einlesen */
function readShared(xml) {
  const out = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g;
  let m;
  while ((m = siRe.exec(xml))) {
    const parts = m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
    out.push(unesc(parts.map((p) => p.replace(/<[^>]+>/g, "")).join("")));
  }
  return out;
}

/* CSV zerlegen, Trennzeichen wird erkannt */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const head = text.slice(0, 5000);
  const sep = (head.split(";").length > head.split(",").length) ? ";"
            : (head.split("\t").length > head.split(",").length) ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* Öffentliche Funktion: Datei -> { blätter: [{name, grid}] } */
async function readSpreadsheet(file) {
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".csv") || name.endsWith(".txt")) {
    let text;
    const buf = await file.arrayBuffer();
    text = new TextDecoder("utf-8").decode(buf);
    /* Wenn Umlaute kaputt aussehen, Windows-Kodierung versuchen */
    if (text.indexOf("\ufffd") > -1) {
      try { text = new TextDecoder("windows-1252").decode(buf); } catch (e) {}
    }
    return [{ name: "CSV", grid: parseCSV(text) }];
  }
  const files = await unzip(await file.arrayBuffer());
  const ssKey = Object.keys(files).find((k) => k.indexOf("sharedStrings.xml") > -1);
  const shared = ssKey ? readShared(dec(files[ssKey])) : [];
  /* Blattnamen aus workbook.xml holen */
  const wbKey = Object.keys(files).find((k) => /xl\/workbook\.xml$/.test(k));
  let names = [];
  if (wbKey) {
    const wx = dec(files[wbKey]);
    const re = /<sheet[^>]*name="([^"]*)"/g; let m;
    while ((m = re.exec(wx))) names.push(unesc(m[1]));
  }
  const sheetKeys = Object.keys(files)
    .filter((k) => /xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a, b) => (+(/(\d+)\.xml/.exec(a)[1])) - (+(/(\d+)\.xml/.exec(b)[1])));
  if (!sheetKeys.length) throw new Error("Keine Tabellenblätter gefunden.");
  return sheetKeys.map((k, i) => ({
    name: names[i] || ("Tabelle " + (i + 1)),
    grid: sheetToGrid(dec(files[k]), shared)
  }));
}

/* Eingegebenen Text in Zeilen zerlegen.
   Getrennt wird an Tabulator, Semikolon oder Komma — je nachdem was vorkommt. */
function impRows() {
  const i = S.imp;
  if (!i || !i.text.trim()) return [];
  let g = i.text.split(/\r?\n/).map((line) => {
    const t = line.trim();
    if (!t) return null;
    let parts;
    if (t.indexOf("\t") > -1) parts = t.split("\t");
    else if (t.indexOf(";") > -1) parts = t.split(";");
    else if (t.indexOf(",") > -1) parts = t.split(",");
    else parts = [t];
    return { ort: (parts[0] || "").trim(), art: (parts[1] || "").trim() };
  }).filter((r) => r && (r.ort || r.art));
  if (i.only.trim()) g = g.filter((r) => r.ort.indexOf(i.only.trim()) === 0);
  if (i.pal) g = g.filter((r) => isPal(r.art));
  return g.map((r) => ({ ort: r.ort, art: r.art, kapazitaet: "", bemerkung: "", status: "frei" }));
}

    '</section>' : "";

        '<div class="row"><input class="inl" style="font-weight:600" value="' + esc(p.title) +
          '" placeholder="Projektname" data-prj="' + p.id + '" data-k="title" />' +

        '<div class="wrapf" style="margin-top:8px;align-items:center">' +
          '<select class="f" style="width:auto;padding:6px 30px 6px 10px;font-size:14px" data-prj="' + p.id + '" data-k="owner">' +
            '<option value="">Verantwortlich —</option>' + people.map((x) =>

function kpiBuild() {
  const i = S.kimp;
  if (!i || i.cName === "") return null;
  const grid = i.sheets[i.si].grid.slice(1);
  const heads = i.sheets[i.si].grid[0] || [];
  const map = {};
  grid.forEach((r) => {
    const who = String(r[+i.cName] == null ? "" : r[+i.cName]).trim();
    if (!who) return;
    const v = i.cVal === "" ? 1 : num(r[+i.cVal]);
    const cat = i.cCat === "" ? "" : (String(r[+i.cCat] == null ? "" : r[+i.cCat]).trim() || "Ohne");
    if (!map[who]) map[who] = { name: who, sum: 0, rows: 0, cats: {} };
    map[who].sum += v; map[who].rows++;
    if (cat) map[who].cats[cat] = (map[who].cats[cat] || 0) + v;
  });
  const list = Object.keys(map).map((k) => map[k]).sort((a, b) => b.sum - a.sum);
  if (!list.length) return null;
  return { week: i.week.trim(), file: i.fname, at: Date.now(),
    unit: i.cVal === "" ? "Zeilen" : String(heads[+i.cVal] || "").trim() || "Menge",
    list, total: list.reduce((s, x) => s + x.sum, 0) };
}

/* ---------------- Reiter: Schott-Umlagerungen ---------------- */

  const list = S.data.schott || [];
  const done = list.filter((r) => r.aus);

  const shown = S.fScho === "offen" ? open : S.fScho === "fertig" ? done : list;

  const tiles =

      '<b>' + list.length + '</b><span>Einträge gesamt</span></button>' +

      '<b>' + open.length + '</b><span><i class="dot" style="background:var(--am)"></i>Offen</span></button>' +
    '<button class="tile ' + (S.fScho === "fertig" ? "on" : "") + '" data-fscho="fertig">' +
      '<b>' + done.length + '</b><span><i class="dot" style="background:var(--em)"></i>Ausgelagert</span></button>' +
    '<div class="tile"><b>' + de(pal(list)) + '</b><span>Paletten gesamt</span></div>';

  /* Aufteilung nach Bereich in GiGu */
  const areas = [...new Set(list.map((r) => (r.gigu || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "de"));
  const byArea = areas.length ? '<section class="card">' +
    '<div class="hd"><span class="up">Paletten nach Bereich in GiGu</span></div><div class="divide">' +
    areas.map((a) => {
      const rs = list.filter((r) => (r.gigu || "").trim() === a);
      const o = rs.filter((r) => !r.aus).length;
      return '<div class="row pad" style="padding:9px 12px">' +
        '<span style="flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;' +
          'white-space:nowrap">' + esc(a) + '</span>' +
        '<span class="tiny">' + rs.length + " Einträge" + (o ? " · " + o + " offen" : "") + '</span>' +
        '<span class="num" style="font-weight:600;width:64px;text-align:right">' + de(pal(rs)) + '</span>' +
        '</div>';
    }).join("") + '</div></section>' : "";

  const rows = shown.map((r) =>
    '<tr>' +
      '<td><input class="inl" style="font-weight:500" value="' + esc(r.art) +
        '" placeholder="Artikel" data-scho="' + r.id + '" data-k="art" /></td>' +
      '<td><input class="inl num" value="' + esc(r.ort) +
        '" placeholder="Lagerort" data-scho="' + r.id + '" data-k="ort" /></td>' +
      '<td><input class="inl" style="color:var(--dim)" value="' + esc(r.gigu) +
        '" placeholder="Bereich" data-scho="' + r.id + '" data-k="gigu" /></td>' +
      '<td style="width:88px"><input class="inl num" style="text-align:right" value="' + esc(r.pal) +
        '" placeholder="0" inputmode="decimal" data-scho="' + r.id + '" data-k="pal" /></td>' +
      '<td style="width:150px"><input type="date" class="inl" style="color-scheme:dark;color:' +
        (r.aus ? "var(--em)" : "var(--dim3)") + '" value="' + esc(r.aus) +
        '" data-scho="' + r.id + '" data-k="aus" /></td>' +
      '<td><input class="inl" style="color:var(--dim)" value="' + esc(r.note || "") +
        '" placeholder="Notiz…" data-scho="' + r.id + '" data-k="note" /></td>' +
      '<td><button class="iconbtn" data-delscho="' + r.id + '">' + ico("x") + '</button></td>' +
    '</tr>').join("");

  return '<div class="stack">' +
    '<div class="grid4">' + tiles + '</div>' + byArea +
    '<div class="row"><span class="muted" style="flex:1">' +
      (S.fScho ? shown.length + " von " + list.length + " gezeigt · " + de(pal(shown)) + " Paletten"
               : list.length + " Umlagerungen erfasst") + '</span>' +
      (S.fScho ? '<button class="btn" data-act="clearscho">' + ico("x") + 'Filter zurücksetzen</button>' : "") +
    '</div>' +
    '<div class="tblwrap"><table><thead><tr>' +
      '<th>Artikel</th><th>Lagerort</th><th>Bereich in GiGu</th><th style="text-align:right">Paletten</th>' +
      '<th>Ausgelagert am</th><th>Notiz</th><th></th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="7" class="muted" style="padding:14px">Noch keine Umlagerungen.</td></tr>') +
      '</tbody></table></div>' +
    '<button class="dash" data-act="addscho">' + ico("plus") + 'Umlagerung hinzufügen</button></div>';
}

/* ---------------- Reiter: Probleme ---------------- */
function viewProbs() {
  const list = S.data.probs || [];
  const open = list.filter((r) => !r.ok);
  const done = list.filter((r) => r.ok);
  const shown = S.fProb === "erledigt" ? done : S.fProb === "offen" ? open : list;

  const tiles =
    '<button class="tile ' + (S.fProb === "" ? "on" : "") + '" data-fprob="">' +
      '<b>' + list.length + '</b><span>Gesamt</span></button>' +
    '<button class="tile ' + (S.fProb === "offen" ? "on" : "") + '" data-fprob="offen">' +
      '<b>' + open.length + '</b><span><i class="dot" style="background:var(--ro)"></i>Offen</span></button>' +
    '<button class="tile ' + (S.fProb === "erledigt" ? "on" : "") + '" data-fprob="erledigt">' +
      '<b>' + done.length + '</b><span><i class="dot" style="background:var(--em)"></i>Erledigt</span></button>';

  const cards = shown.map((r) =>
    '<section class="card pad" style="' + (r.ok ? "opacity:.6" : "border-color:rgba(251,113,133,.35)") + '">' +
      '<div class="row" style="margin-bottom:8px">' +
        '<button class="chk ' + (r.ok ? "on" : "") + '" data-probok="' + r.id + '" ' +
          'title="' + (r.ok ? "Wieder öffnen" : "Als erledigt markieren") + '">' + ico("check") + '</button>' +
        '<input class="inl num" style="font-weight:600' + (r.ok ? ";text-decoration:line-through;color:var(--dim3)" : "") +
          '" value="' + esc(r.ort) + '" placeholder="Lagerort" data-prob="' + r.id + '" data-k="ort" />' +
        '<span class="tiny num">' + (r.at ? ago(r.at, S.now) : "") + '</span>' +
        '<button class="iconbtn" data-delprob="' + r.id + '">' + ico("x") + '</button>' +
      '</div>' +
      '<textarea class="f" rows="2" style="resize:vertical;font-size:14px" ' +
        'placeholder="Was ist mit diesem Platz? Beschreibung, Ursache, was zu tun ist…" ' +
        'data-prob="' + r.id + '" data-k="note">' + esc(r.note) + '</textarea>' +
    '</section>').join("");

  return '<div class="stack">' +
    '<div class="grid3">' + tiles + '</div>' +
    '<div class="row"><span class="muted" style="flex:1">' +
      (S.fProb ? shown.length + " von " + list.length + " gezeigt"
               : list.length + (list.length === 1 ? " Problem erfasst" : " Probleme erfasst")) + '</span>' +
      (S.fProb ? '<button class="btn" data-act="clearprob">' + ico("x") + 'Filter zurücksetzen</button>' : "") +
    '</div>' +
    (cards || '<p class="muted">Keine Einträge.</p>') +
    '<button class="dash" data-act="addprob">' + ico("plus") + 'Problem eintragen</button></div>';
}

        '<button class="chip" data-laysize="' + sel.id + '|h-">Flacher</button>' +

      '<td style="padding:9px 12px;font-weight:550">' + esc(f.name || "—") + '</td>' +

/* ---------------- Reiter: Kartonagenübersicht ---------------- */
function viewKarton() {
  const list = S.data.karton || [];
  const st = (r) => {
    const b = num(r.best), m = num(r.min);
    if (!m) return "ok";
    if (b <= 0) return "leer";
    if (b < m) return "kritisch";
    if (b < m * 1.25) return "knapp";
    return "ok";
  };
  const leer = list.filter((r) => st(r) === "leer").length;
  const krit = list.filter((r) => st(r) === "kritisch").length;
  const knapp = list.filter((r) => st(r) === "knapp").length;

  const shown = S.fKart ? list.filter((r) => {
    const x = st(r);
    return S.fKart === "warn" ? (x === "leer" || x === "kritisch" || x === "knapp") : x === S.fKart;
  }) : list;

  const tiles =
    '<button class="tile ' + (S.fKart === "" ? "on" : "") + '" data-fkart="">' +
      '<b>' + list.length + '</b><span>Artikel</span></button>' +
    '<button class="tile ' + (S.fKart === "leer" ? "on" : "") + '" data-fkart="leer">' +
      '<b>' + leer + '</b><span><i class="dot" style="background:var(--ro)"></i>Leer</span></button>' +
    '<button class="tile ' + (S.fKart === "kritisch" ? "on" : "") + '" data-fkart="kritisch">' +
      '<b>' + krit + '</b><span><i class="dot" style="background:var(--am)"></i>Unter Mindest</span></button>' +
    '<button class="tile ' + (S.fKart === "knapp" ? "on" : "") + '" data-fkart="knapp">' +
      '<b>' + knapp + '</b><span><i class="dot" style="background:var(--sk)"></i>Knapp</span></button>';

  const COL = { leer: "var(--ro)", kritisch: "var(--am)", knapp: "var(--sk)", ok: "var(--em)" };
  const TXT = { leer: "Leer", kritisch: "Unter Mindest", knapp: "Knapp", ok: "Bestand ok" };

  const rows = shown.map((r) => {
    const x = st(r), b = num(r.best), m = num(r.min);
    const pct = m ? Math.max(0, Math.min(100, (b / (m * 2)) * 100)) : (b > 0 ? 100 : 0);
    return '<tr>' +
      '<td style="width:8px;padding:0"><i style="display:block;width:3px;height:38px;' +
        'background:' + COL[x] + ';border-radius:0 2px 2px 0"></i></td>' +
      '<td><input class="inl" style="font-weight:550" value="' + esc(r.art) +
        '" placeholder="Artikel" data-kart="' + r.id + '" data-k="art" /></td>' +
      '<td style="width:96px"><input class="inl num" style="text-align:right;font-weight:600" value="' +
        esc(r.best) + '" placeholder="0" inputmode="decimal" data-kart="' + r.id + '" data-k="best" /></td>' +
      '<td style="width:96px"><input class="inl num" style="text-align:right;color:var(--dim2)" value="' +
        esc(r.min) + '" placeholder="0" inputmode="decimal" data-kart="' + r.id + '" data-k="min" /></td>' +
      '<td style="width:120px"><div class="bar" style="height:5px"><i style="width:' + pct + '%;' +
        'background:' + COL[x] + '"></i></div></td>' +
      '<td style="width:118px"><span class="chip" style="border-color:' + COL[x] + ';color:' + COL[x] + '">' +
        TXT[x] + '</span></td>' +
      '<td><input class="inl" style="color:var(--dim2)" value="' + esc(r.note || "") +
        '" placeholder="Notiz…" data-kart="' + r.id + '" data-k="note" /></td>' +
      '<td><button class="iconbtn" data-delkart="' + r.id + '">' + ico("x") + '</button></td></tr>';
  }).join("");

  return '<div class="stack">' +
    '<div class="grid4">' + tiles + '</div>' +
    (leer + krit ? '<div class="banner warn">' + ico("alert") +
      '<span style="flex:1;font-size:13.5px;color:var(--acc-txt)">' +
      (leer ? leer + (leer === 1 ? " Artikel ist leer" : " Artikel sind leer") : "") +
      (leer && krit ? ", " : "") +
      (krit ? krit + " unter Mindestbestand" : "") + ". Nachschub anfordern." +
      '</span></div>' : "") +
    '<div class="row"><span class="muted" style="flex:1">' +
      (S.fKart ? shown.length + " von " + list.length + " gezeigt"
               : list.length + " Artikel erfasst") + '</span>' +
      (S.fKart ? '<button class="btn" data-act="clearkart">' + ico("x") + 'Filter zurücksetzen</button>' : "") +
    '</div>' +
    '<div class="tblwrap"><table><thead><tr>' +
      '<th></th><th>Artikel</th><th style="text-align:right">Bestand</th>' +
      '<th style="text-align:right">Mindest</th><th>Füllstand</th><th>Status</th><th>Notiz</th><th></th>' +
      '</tr></thead><tbody>' +
      (rows || '<tr><td colspan="8" class="muted" style="padding:14px">Noch keine Artikel.</td></tr>') +
      '</tbody></table></div>' +
    '<button class="dash" data-act="addkart">' + ico("plus") + 'Artikel hinzufügen</button></div>';
}

/* ---------------- Reiter: DBAG-Umzug ---------------- */
const DSTAT = [
  { id: "offen",   label: "Offen",     col: "var(--dim2)" },
  { id: "arbeit",  label: "In Arbeit", col: "var(--am)" },
  { id: "fertig",  label: "Erledigt",  col: "var(--em)" }
];
function viewDbag() {
  const list = S.data.dbag || [];
  const cnt = (id) => list.filter((r) => (r.status || "offen") === id).length;
  const done = cnt("fertig");
  const pct = list.length ? Math.round((done / list.length) * 100) : 0;

  const shown = S.fDbag ? list.filter((r) => (r.status || "offen") === S.fDbag) : list;

  const tiles =
    '<button class="tile ' + (S.fDbag === "" ? "on" : "") + '" data-fdbag="">' +
      '<b>' + list.length + '</b><span>Gesamt</span></button>' +
    DSTAT.map((s) =>
      '<button class="tile ' + (S.fDbag === s.id ? "on" : "") + '" data-fdbag="' + s.id + '">' +
      '<b>' + cnt(s.id) + '</b><span><i class="dot" style="background:' + s.col + '"></i>' +
      s.label + "</span></button>").join("");

  const progress = list.length ? '<section class="card pad">' +
    '<div class="row" style="align-items:baseline;gap:8px;margin-bottom:9px">' +
      '<span class="num" style="font-size:26px;font-weight:640;letter-spacing:-.03em">' + pct + '%</span>' +
      '<span class="muted">' + done + " von " + list.length + " erledigt</span></div>" +
    '<div class="bar"><i class="' + (pct === 100 ? "done" : "") + '" style="width:' + pct + '%"></i></div>' +
    '</section>' : "";

  const rows = shown.map((r) => {
    const s = DSTAT.find((x) => x.id === (r.status || "offen")) || DSTAT[0];
    return '<tr>' +
      '<td><input class="inl" style="font-weight:550" value="' + esc(r.art) +
        '" placeholder="Artikel" data-dbag="' + r.id + '" data-k="art" /></td>' +
      '<td style="width:80px"><input class="inl num" style="text-align:right" value="' + esc(r.menge) +
        '" placeholder="0" inputmode="decimal" data-dbag="' + r.id + '" data-k="menge" /></td>' +
      '<td style="width:130px"><input class="inl num" value="' + esc(r.von) +
        '" placeholder="von" data-dbag="' + r.id + '" data-k="von" /></td>' +
      '<td style="width:130px"><input class="inl num" value="' + esc(r.nach) +
        '" placeholder="nach" data-dbag="' + r.id + '" data-k="nach" /></td>' +
      '<td style="width:150px"><input type="date" class="inl" style="color-scheme:dark;color:' +
        (r.datum ? "var(--fg)" : "var(--dim3)") + '" value="' + esc(r.datum) +
        '" data-dbag="' + r.id + '" data-k="datum" /></td>' +
      '<td style="width:132px"><button class="chip" style="border-color:' + s.col + ';color:' + s.col +
        ';cursor:pointer" data-dbagstep="' + r.id + '" title="Weiterschalten">' +
        '<i class="dot" style="background:' + s.col + '"></i>' + s.label + '</button></td>' +
      '<td><input class="inl" style="color:var(--dim2)" value="' + esc(r.note || "") +
        '" placeholder="Notiz…" data-dbag="' + r.id + '" data-k="note" /></td>' +
      '<td><button class="iconbtn" data-deldbag="' + r.id + '">' + ico("x") + '</button></td></tr>';
  }).join("");

  return '<div class="stack">' +
    '<div class="grid4">' + tiles + '</div>' + progress +
    '<div class="row"><span class="muted" style="flex:1">' +
      (S.fDbag ? shown.length + " von " + list.length + " gezeigt"
               : list.length + (list.length === 1 ? " Position erfasst" : " Positionen erfasst")) + '</span>' +
      (S.fDbag ? '<button class="btn" data-act="cleardbag">' + ico("x") + 'Filter zurücksetzen</button>' : "") +
    '</div>' +
    '<div class="tblwrap"><table><thead><tr>' +
      '<th>Artikel</th><th style="text-align:right">Menge</th><th>Von</th><th>Nach</th>' +
      '<th>Datum</th><th>Status</th><th>Notiz</th><th></th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="8" class="muted" style="padding:14px">Noch keine Positionen.</td></tr>') +
      '</tbody></table></div>' +
    '<button class="dash" data-act="adddbag">' + ico("plus") + 'Position hinzufügen</button></div>';
}

/* =========================================================================
   Ereignisse
   ========================================================================= */
const pick = (accept) => new Promise((res) => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept;
  inp.onchange = () => res(inp.files[0] || null);
  inp.click();
});

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, [data-tab]");
  if (!t) return;
  const g = (k) => t.getAttribute(k);

  if (g("data-tab")) { S.tab = g("data-tab"); render(); return; }

  const act = g("data-act");
  const sp = (v) => (v || "").split("|");

  /* Konsolidierungsplätze */
  if (act === "addapp") return commit((d) =>
    d.apps.push({ id: uid(), name: "Konsolidierungsplatz " + (d.apps.length + 1), slots: [] }));
  if (g("data-delapp")) return commit((d) => d.apps = d.apps.filter((a) => a.id !== g("data-delapp")));
  if (g("data-addslot")) return commit((d) =>
    d.apps.find((a) => a.id === g("data-addslot")).slots.push({ id: uid(), name: "", status: "frei", note: "" }));
  if (g("data-delslot")) { const [a, s] = sp(g("data-delslot"));
    return commit((d) => { const x = d.apps.find((y) => y.id === a); x.slots = x.slots.filter((y) => y.id !== s); }); }
  if (g("data-slotst")) { const [a, s, st] = sp(g("data-slotst"));
    return commit((d) => d.apps.find((y) => y.id === a).slots.find((y) => y.id === s).status = st); }

  /* Lagerorte */
  if (act === "addrow") return commit((d) => d.free.push({ id: uid(), ort: "", art: "",
    kapazitaet: "", bemerkung: "", status: "frei", src: "", srcAt: Date.now() }));
  if (g("data-delrow")) return commit((d) => d.free = d.free.filter((r) => r.id !== g("data-delrow")));
  if (g("data-rowst")) { const [id, st] = sp(g("data-rowst"));
    return commit((d) => { const r = d.free.find((x) => x.id === id); r.status = st; r.editAt = Date.now(); }); }
  if (g("data-fstatus")) { S.fStatus = S.fStatus === g("data-fstatus") ? "" : g("data-fstatus"); return render(); }
  if (g("data-fart")) { S.fArt = S.fArt === g("data-fart") ? "" : g("data-fart"); return render(); }
  if (act === "clearf") { S.fArt = S.fStatus = ""; return render(); }

  /* Import Lagerorte */
  if (act === "openpaste") { S.imp = { text: "", pal: true, only: "" }; return render(); }
  if (act === "impcancel") { S.imp = null; return render(); }
  const grab = () => {
    const ta = $("#impfeed"), on = $("#imponly");
    if (ta) S.imp.text = ta.value;
    if (on) S.imp.only = on.value;
  };
  if (act === "impread") { grab(); return render(); }
  if (act === "imppal") { grab(); S.imp.pal = !S.imp.pal; return render(); }
  if (act === "impappend" || act === "impreplace") {
    grab();
    const rows = impRows(), src = "Eingabe", mode = act === "impreplace";
    if (mode && !confirm("Bestehende Tabelle durch " + rows.length + " Zeilen ersetzen?")) return;
    S.imp = null;
    return commit((d) => {
      const at = Date.now();
      const fresh = rows.map((r) => Object.assign({ id: uid(), src, srcAt: at }, r));
      d.free = mode ? fresh : d.free.concat(fresh);
    });
  }

  /* Stapler */
  if (g("data-area")) { const [id, a] = sp(g("data-area"));
    return commit((d) => { const x = d.drivers.find((y) => y.id === id); x.area = a; x.at = Date.now(); }); }

  /* Projekte */
  if (act === "addprj") return commit((d) => (d.projects = d.projects || []).push(
    { id: uid(), title: "", owner: "", due: "", prio: "normal", note: "", tasks: [] }));
  if (g("data-delprj")) return commit((d) => d.projects = d.projects.filter((p) => p.id !== g("data-delprj")));
  if (g("data-addtask")) return commit((d) =>
    d.projects.find((p) => p.id === g("data-addtask")).tasks.push({ id: uid(), text: "", owner: "", done: false }));
  if (g("data-deltask")) { const [p, tt] = sp(g("data-deltask"));
    return commit((d) => { const x = d.projects.find((y) => y.id === p); x.tasks = x.tasks.filter((y) => y.id !== tt); }); }
  if (g("data-task")) { const [p, tt] = sp(g("data-task"));
    return commit((d) => { const x = d.projects.find((y) => y.id === p).tasks.find((y) => y.id === tt); x.done = !x.done; }); }
  if (g("data-prjprio")) { const [p, pr] = sp(g("data-prjprio"));
    return commit((d) => d.projects.find((y) => y.id === p).prio = pr); }

  /* KPI */
  if (act === "pickkpi") {
    const f = await pick(".xlsx,.xls,.csv");
    if (!f) return;
    try {
      const sheets = await readSpreadsheet(f);
      S.kimp = { fname: f.name, sheets, si: 0, week: "", cName: "", cVal: "", cCat: "" };
      render();
    } catch (err) { alert("Datei konnte nicht gelesen werden.\n" + err.message); }
    return;
  }
  if (act === "kcancel") { S.kimp = null; return render(); }
  if (act === "ksave") {
    S.kimp.week = $("#kweek").value;
    const res = kpiBuild();
    S.kimp = null;
    return commit((d) => d.kpi = res);
  }
  if (act === "kclear") {
    if (!confirm("Auswertung löschen?")) return;
    return commit((d) => d.kpi = null);
  }

  /* Schott-Umlagerungen */
  if (act === "addscho") return commit((d) => (d.schott = d.schott || []).unshift(
    { id: uid(), art: "", ort: "", gigu: "", pal: "", aus: "", note: "" }));
  if (g("data-delscho")) return commit((d) => d.schott = d.schott.filter((r) => r.id !== g("data-delscho")));
  if (t.hasAttribute("data-fscho")) { S.fScho = g("data-fscho"); return render(); }
  if (act === "clearscho") { S.fScho = ""; return render(); }

  /* Probleme */
  if (act === "addprob") return commit((d) => (d.probs = d.probs || []).unshift(
    { id: uid(), ort: "", note: "", ok: false, at: Date.now() }));
  if (g("data-delprob")) return commit((d) => d.probs = d.probs.filter((r) => r.id !== g("data-delprob")));
  if (g("data-probok")) return commit((d) => {
    const r = d.probs.find((x) => x.id === g("data-probok")); r.ok = !r.ok;
  });
  if (t.hasAttribute("data-fprob")) { S.fProb = g("data-fprob"); return render(); }
  if (act === "clearprob") { S.fProb = ""; return render(); }

  /* Layout */
  if (act === "addlay") {
    const id = uid();
    S.laySel = id;
    return commit((d) => (d.layout = d.layout || []).push(
      { id, name: "Feld " + ((d.layout || []).length + 1), art: "", note: "",
        x: 6, y: 6, w: 20, h: 14 }));
  }
  if (g("data-dellay")) {
    const id = g("data-dellay");
    if (S.laySel === id) S.laySel = "";
    return commit((d) => d.layout = d.layout.filter((f) => f.id !== id));
  }
  if (act === "layclose") { S.laySel = ""; return render(); }
  if (g("data-laysize")) {
    const [id, op] = sp(g("data-laysize"));
    return commit((d) => {
      const f = d.layout.find((x) => x.id === id);
      if (op === "w+") f.w = Math.min(90, f.w + 5);
      if (op === "w-") f.w = Math.max(8, f.w - 5);
      if (op === "h+") f.h = Math.min(90, f.h + 4);
      if (op === "h-") f.h = Math.max(6, f.h - 4);
    });
  }

  /* Kartonagen */
  if (act === "addkart") return commit((d) => (d.karton = d.karton || []).push(
    { id: uid(), art: "", best: "", min: "", note: "" }));
  if (g("data-delkart")) return commit((d) => d.karton = d.karton.filter((r) => r.id !== g("data-delkart")));
  if (t.hasAttribute("data-fkart")) { S.fKart = g("data-fkart"); return render(); }
  if (act === "clearkart") { S.fKart = ""; return render(); }

  /* DBAG-Umzug */
  if (act === "adddbag") return commit((d) => (d.dbag = d.dbag || []).unshift(
    { id: uid(), art: "", menge: "", von: "", nach: "", datum: "", status: "offen", note: "" }));
  if (g("data-deldbag")) return commit((d) => d.dbag = d.dbag.filter((r) => r.id !== g("data-deldbag")));
  if (g("data-dbagstep")) return commit((d) => {
    const r = d.dbag.find((x) => x.id === g("data-dbagstep"));
    const order = ["offen", "arbeit", "fertig"];
    r.status = order[(order.indexOf(r.status || "offen") + 1) % 3];
  });
  if (t.hasAttribute("data-fdbag")) { S.fDbag = g("data-fdbag"); return render(); }
  if (act === "cleardbag") { S.fDbag = ""; return render(); }

  /* Bereiche */
  if (act === "addarea") {
    const v = ($("#newarea").value || "").trim();
    if (!v || S.data.areas.indexOf(v) > -1) return;
    return commit((d) => d.areas.push(v));
  }
  if (g("data-delarea")) return commit((d) => d.areas = d.areas.filter((a) => a !== g("data-delarea")));

  /* Sync */
  if (act === "synctest") {
    const m = $("#syncmsg");
    if (m) m.textContent = "Wird geprüft…";
    try {
      await store.get();
      if (m) { m.textContent = "Verbindung in Ordnung."; m.style.color = "var(--em)"; }
    } catch (err) {
      if (m) { m.textContent = "Fehler: " + err.message; m.style.color = "var(--ro)"; }
    }
    return;
  }
  if (act === "refresh") { await pull(true); render(); return; }
});

/* ---------- Felder im Layout verschieben (Maus und Finger) ---------- */
let drag = null;

document.addEventListener("pointerdown", (e) => {
  const el = e.target.closest ? e.target.closest(".lf") : null;
  if (!el) return;
  const board = document.querySelector("#layboard");
  if (!board) return;
  const id = el.getAttribute("data-lf");
  const f = (S.data.layout || []).find((x) => x.id === id);
  if (!f) return;
  const b = board.getBoundingClientRect();
  drag = { id, el, b, moved: false,
    dx: e.clientX - (b.left + (f.x / 100) * b.width),
    dy: e.clientY - (b.top + (f.y / 100) * b.height), f };
  el.setPointerCapture && el.setPointerCapture(e.pointerId);
  e.preventDefault();
});

document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const { b, f, el } = drag;
  let x = ((e.clientX - drag.dx - b.left) / b.width) * 100;
  let y = ((e.clientY - drag.dy - b.top) / b.height) * 100;
  x = Math.max(0, Math.min(100 - f.w, x));
  y = Math.max(0, Math.min(100 - f.h, y));
  if (Math.abs(x - f.x) > 0.3 || Math.abs(y - f.y) > 0.3) drag.moved = true;
  drag.nx = x; drag.ny = y;
  el.style.left = x + "%";
  el.style.top = y + "%";
});

document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { S.laySel = d.id; return render(); }        /* Tippen = auswählen */
  commit((s) => {                                            /* Ziehen = Position sichern */
    const f = s.layout.find((x) => x.id === d.id);
    f.x = Math.round(d.nx * 10) / 10;
    f.y = Math.round(d.ny * 10) / 10;
  });
});
document.addEventListener("pointercancel", () => { drag = null; });

/* Texteingaben */
document.addEventListener("input", (e) => {
  const el = e.target, k = el.getAttribute("data-k");
  const set = (fn) => {
    fn(S.data);
    S.data.rev = (S.data.rev || 0) + 1; S.rev = S.data.rev;
    S.sync = "saving"; paintHeader();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await store.set(S.data); S.sync = "idle"; S.err = ""; }
      catch (x) { S.sync = "error"; S.err = x.message; }
      paintHeader();
    }, 600);
  };
  const sp = (v) => (v || "").split("|");

  if (el.getAttribute("data-app")) return set((d) =>
    d.apps.find((a) => a.id === el.getAttribute("data-app"))[k] = el.value);
  if (el.getAttribute("data-slot")) { const [a, s] = sp(el.getAttribute("data-slot"));
    return set((d) => d.apps.find((x) => x.id === a).slots.find((x) => x.id === s)[k] = el.value); }
  if (el.getAttribute("data-row")) return set((d) => {
    const r = d.free.find((x) => x.id === el.getAttribute("data-row"));
    r[k] = el.value; r.editAt = Date.now();
  });
  if (el.getAttribute("data-drv")) return set((d) => {
    const x = d.drivers.find((y) => y.id === el.getAttribute("data-drv"));
    x[k] = el.value; if (k === "note") x.at = Date.now();
  });
  if (el.getAttribute("data-lay")) return set((d) =>
    d.layout.find((f) => f.id === el.getAttribute("data-lay"))[k] = el.value);
  if (el.getAttribute("data-dbag")) return set((d) =>
    d.dbag.find((r) => r.id === el.getAttribute("data-dbag"))[k] = el.value);
  if (el.getAttribute("data-kart")) return set((d) =>
    d.karton.find((r) => r.id === el.getAttribute("data-kart"))[k] = el.value);
  if (el.getAttribute("data-prob")) return set((d) =>
    d.probs.find((r) => r.id === el.getAttribute("data-prob"))[k] = el.value);
  if (el.getAttribute("data-scho")) return set((d) =>
    d.schott.find((r) => r.id === el.getAttribute("data-scho"))[k] = el.value);
  if (el.getAttribute("data-prj")) return set((d) =>
    d.projects.find((p) => p.id === el.getAttribute("data-prj"))[k] = el.value);
  if (el.getAttribute("data-tsk")) { const [p, tt] = sp(el.getAttribute("data-tsk"));
    return set((d) => d.projects.find((x) => x.id === p).tasks.find((x) => x.id === tt)[k] = el.value); }
});

/* Auswahlfelder im Import */
document.addEventListener("change", (e) => {
  /* Datumsfeld und Auswahlfelder lösen kein input aus -> hier nachziehen */
  const el = e.target;
  if (el.getAttribute("data-scho") || el.getAttribute("data-prj") || el.getAttribute("data-tsk") ||
      el.getAttribute("data-dbag")) {
    el.dispatchEvent(new Event("input", { bubbles: true }));
    setTimeout(render, 0);
    return;
  }
  const a = el.getAttribute("data-act");
  if (!a) return;
  if (a === "impsheet") { S.imp.si = +e.target.value; return render(); }
  if (a === "ksheet") { S.kimp.si = +e.target.value; S.kimp.cName = S.kimp.cVal = S.kimp.cCat = ""; return render(); }
  if (a === "kname") { S.kimp.week = $("#kweek").value; S.kimp.cName = e.target.value; return render(); }
  if (a === "kval")  { S.kimp.week = $("#kweek").value; S.kimp.cVal  = e.target.value; return render(); }
  if (a === "kcat")  { S.kimp.week = $("#kweek").value; S.kimp.cCat  = e.target.value; return render(); }
});

/* =========================================================================
   Start
   ========================================================================= */
(async function () {
  await pull(true);
  S.loaded = true;
  render();
  setInterval(() => { S.now = Date.now(); if (S.tab === "free" || S.tab === "kpi") render(); }, 60000);
  setInterval(async () => {
    if (!syncOn()) return;                 /* ohne Sync kein Abgleich nötig */
    if (S.imp || S.kimp) return;           /* nicht während eines Imports */
    if (drag) return;                      /* nicht während des Verschiebens */
    if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const before = S.rev;
    await pull(false);
    if (S.rev !== before) render();
  }, 5000);
})();
</script>
