<!DOCTYPE html>
<html lang="de">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#09090b" />
<title>Lagerboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128230;</text></svg>" />
<style>

  --bg:#09090b; --fg:#f4f4f5; --dim:#a1a1aa; --dim2:#71717a; --dim3:#52525b;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.25);

  --cy:#22d3ee; --cyd:rgba(34,211,238,.15); --cyb:rgba(34,211,238,.45);

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.96);

.hrow{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{width:36px;height:36px;flex:0 0 auto;border-radius:9px;background:var(--cyd);
  box-shadow:inset 0 0 0 1px var(--cyb);display:flex;align-items:center;justify-content:center;font-size:19px}
h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--dim2);margin:1px 0 0}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:none;
  color:var(--dim2);font:500 14px system-ui;padding:8px 12px;border-radius:9px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.05);color:var(--fg)}
nav button.on{background:var(--cyd);color:#a5f3fc;box-shadow:inset 0 0 0 1px var(--cyb)}
main{padding:16px 0 96px}
section.card{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.pad{padding:12px}
.hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.hd .t{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack>*+*{margin-top:12px}
.stack4>*+*{margin-top:16px}
.muted{color:var(--dim2);font-size:14px}
.tiny{color:var(--dim3);font-size:12px}
.up{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim2)}
.num{font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;color:var(--fg)}
.f{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.3);border-radius:9px;

.f:focus{border-color:var(--cyb);background:rgba(0,0,0,.5)}
.f::placeholder{color:var(--dim3)}
select.f{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim2) 50%),linear-gradient(135deg,var(--dim2) 50%,transparent 50%);

.inl{width:100%;background:none;border:0;outline:none;padding:6px 2px;font-size:15px;color:var(--fg)}
.inl:focus{color:#a5f3fc}
.inl::placeholder{color:var(--dim3)}
button{font:inherit;cursor:pointer}

.btn:hover{border-color:var(--line2);background:rgba(255,255,255,.05);color:var(--fg)}

.wrapf{display:flex;flex-wrap:wrap;gap:6px}

.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}

.center{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--dim2);gap:8px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<div id="root"><div class="center">Lagerboard wird geladen…</div></div>

<script>
"use strict";
/* =========================================================================
   Lagerboard – eigenständige Fassung
   Keine externen Bibliotheken, keine Internet-Verbindung nötig.
   Läuft hinter Firewall und VPN.
   ========================================================================= */

/* ---------------- kleine Helfer ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const de = (n) => Number(n).toLocaleString("de-DE");

const clock = (ts) => !ts ? "—" :
  new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const stamp = (ts) => !ts ? "—" :
  new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit",
    year: "numeric", hour: "2-digit", minute: "2-digit" });
const ago = (ts, now) => {
  if (!ts) return "";
  const m = Math.floor((now - ts) / 60000);
  if (m < 1) return "gerade eben";
  if (m < 60) return "vor " + m + " Min.";
  const h = Math.floor(m / 60);
  if (h < 24) return "vor " + h + " Std.";
  const d = Math.floor(h / 24);
  return d === 1 ? "vor 1 Tag" : "vor " + d + " Tagen";
};
const STALE_H = 8;

/* Zahl aus deutscher oder englischer Schreibweise.
   Heikel ist der einzelne Punkt: "1.250" ist deutsch 1250, englisch 1,25.
   Regel: Punkt mit genau drei Ziffern dahinter und kein Komma im Text
   -> Tausenderpunkt. Sonst Dezimalpunkt. */
const num = (v) => {
  let s = String(v == null ? "" : v).trim().replace(/\s/g, "");
  if (!s) return 0;
  s = s.replace(/[^0-9.,\-]/g, "");
  if (!s) return 0;
  const hasC = s.indexOf(",") > -1, dots = (s.match(/\./g) || []).length;
  if (hasC && dots) s = s.replace(/\./g, "").replace(",", ".");        /* 1.234,56 */
  else if (hasC) s = s.replace(",", ".");                              /* 1,5 */
  else if (dots > 1) s = s.replace(/\./g, "");                         /* 1.234.567 */
  else if (dots === 1 && /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace(".", ""); /* 1.250 */
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};

const STATUS = [
  { id: "frei",     label: "Frei",     col: "var(--em)" },
  { id: "belegt",   label: "Belegt",   col: "var(--am)" },
  { id: "gesperrt", label: "Gesperrt", col: "var(--ro)" },
  { id: "fertig",   label: "Fertig",   col: "var(--sk)" }
];
const PRIO = [
  { id: "hoch",    label: "Hoch",    col: "var(--ro)" },
  { id: "normal",  label: "Normal",  col: "var(--sk)" },
  { id: "niedrig", label: "Niedrig", col: "var(--dim)" }
];

/* Euro-/Einwegpalettenlager erkennen, auch bei abweichender Schreibweise */
const isPal = (v) => {
  const s = String(v || "").toLowerCase().replace(/[\s.\-_]/g, "");
  return s.indexOf("europalett") > -1 || s.indexOf("euopalett") > -1 ||
         s.indexOf("einwegpalett") > -1 || s.indexOf("einwegpal") > -1 ||
         s === "euro" || s === "einweg";
};

/* ---------------- Symbole (inline) ---------------- */
const SVG = {
  box:'<path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  truck:'<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  chart:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  sheet:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h8"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'
};
const ico = (n, cls) => '<svg class="ico ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
  'aria-hidden="true">' + SVG[n] + '</svg>';

/* =========================================================================
   XLSX-/CSV-Leser (eigenbau)
   xlsx ist ein ZIP-Archiv. Der Browser kann deflate seit einigen Jahren
   selbst entpacken (DecompressionStream), daher brauchen wir keine Bibliothek.
   ========================================================================= */

async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "undefined")
    throw new Error("Dieser Browser ist zu alt für .xlsx. Bitte die Datei in Excel als CSV speichern.");
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* ZIP entpacken: liefert { dateiname: Uint8Array } */
async function unzip(buf) {
  const d = new DataView(buf), u = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u.length - 22; i >= 0 && i > u.length - 66000; i--) {
    if (d.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Keine gültige Excel-Datei.");
  const count = d.getUint16(eocd + 10, true);
  let p = d.getUint32(eocd + 16, true);
  const out = {};
  for (let n = 0; n < count; n++) {
    if (d.getUint32(p, true) !== 0x02014b50) break;
    const method = d.getUint16(p + 10, true);
    const csize  = d.getUint32(p + 20, true);
    const nlen   = d.getUint16(p + 28, true);
    const elen   = d.getUint16(p + 30, true);
    const clen   = d.getUint16(p + 32, true);
    const lho    = d.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(u.subarray(p + 46, p + 46 + nlen));
    const lnlen  = d.getUint16(lho + 26, true);
    const lelen  = d.getUint16(lho + 28, true);
    const start  = lho + 30 + lnlen + lelen;
    const raw    = u.subarray(start, start + csize);
    if (name.indexOf("xl/") === 0 || name.indexOf("sheet") > -1) {
      out[name] = method === 0 ? raw : await inflateRaw(raw);
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}

const dec = (b) => new TextDecoder("utf-8").decode(b);
const unesc = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">")
  .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (m, c) =>
    String.fromCharCode(+c)).replace(/&amp;/g, "&");

/* Spaltenbuchstabe -> Index: A=0, B=1, AA=26 */
const colIdx = (ref) => {
  const m = /^([A-Z]+)/.exec(ref || "");
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1]) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};

/* Ein Tabellenblatt in ein Raster aus Text umwandeln */
function sheetToGrid(xml, shared) {
  const rows = [];
  const rowRe = /<row[^>]*>([\s\S]*?)<\/row>|<row[^>]*\/>/g;
  let r;
  while ((r = rowRe.exec(xml))) {
    const inner = r[1] || "";
    const cells = [];
    const cRe = /<c([^>]*)(?:\/>|>([\s\S]*?)<\/c>)/g;
    let c;
    while ((c = cRe.exec(inner))) {
      const attr = c[1] || "", body = c[2] || "";
      const refM = /r="([A-Z]+\d+)"/.exec(attr);
      const idx = refM ? colIdx(refM[1]) : cells.length;
      const type = (/t="([^"]+)"/.exec(attr) || [])[1] || "";
      let val = "";
      if (type === "inlineStr") {
        const t = body.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
        val = t.map((x) => x.replace(/<[^>]+>/g, "")).join("");
      } else {
        const v = /<v[^>]*>([\s\S]*?)<\/v>/.exec(body);
        val = v ? v[1] : "";
        if (type === "s") val = shared[+val] != null ? shared[+val] : "";
      }
      while (cells.length < idx) cells.push("");
      cells[idx] = unesc(val);
    }
    rows.push(cells);
  }
  return rows;
}

/* sharedStrings.xml einlesen */
function readShared(xml) {
  const out = [];
  const siRe = /<si>([\s\S]*?)<\/si>/g;
  let m;
  while ((m = siRe.exec(xml))) {
    const parts = m[1].match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
    out.push(unesc(parts.map((p) => p.replace(/<[^>]+>/g, "")).join("")));
  }
  return out;
}

/* CSV zerlegen, Trennzeichen wird erkannt */
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const head = text.slice(0, 5000);
  const sep = (head.split(";").length > head.split(",").length) ? ";"
            : (head.split("\t").length > head.split(",").length) ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (ch !== "\r") cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* Öffentliche Funktion: Datei -> { blätter: [{name, grid}] } */
async function readSpreadsheet(file) {
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".csv") || name.endsWith(".txt")) {
    let text;
    const buf = await file.arrayBuffer();
    text = new TextDecoder("utf-8").decode(buf);
    /* Wenn Umlaute kaputt aussehen, Windows-Kodierung versuchen */
    if (text.indexOf("\ufffd") > -1) {
      try { text = new TextDecoder("windows-1252").decode(buf); } catch (e) {}
    }
    return [{ name: "CSV", grid: parseCSV(text) }];
  }
  const files = await unzip(await file.arrayBuffer());
  const ssKey = Object.keys(files).find((k) => k.indexOf("sharedStrings.xml") > -1);
  const shared = ssKey ? readShared(dec(files[ssKey])) : [];
  /* Blattnamen aus workbook.xml holen */
  const wbKey = Object.keys(files).find((k) => /xl\/workbook\.xml$/.test(k));
  let names = [];
  if (wbKey) {
    const wx = dec(files[wbKey]);
    const re = /<sheet[^>]*name="([^"]*)"/g; let m;
    while ((m = re.exec(wx))) names.push(unesc(m[1]));
  }
  const sheetKeys = Object.keys(files)
    .filter((k) => /xl\/worksheets\/sheet\d+\.xml$/.test(k))
    .sort((a, b) => (+(/(\d+)\.xml/.exec(a)[1])) - (+(/(\d+)\.xml/.exec(b)[1])));
  if (!sheetKeys.length) throw new Error("Keine Tabellenblätter gefunden.");
  return sheetKeys.map((k, i) => ({
    name: names[i] || ("Tabelle " + (i + 1)),
    grid: sheetToGrid(dec(files[k]), shared)
  }));
}

/* =========================================================================
   Speicher
   Ohne Einrichtung: localStorage (nur dieses Gerät).
   Mit Sync-Daten: jsonbin.io, alle Geräte sehen dasselbe.
   ========================================================================= */
const KEY = "lagerboard:v1";
const CFGK = "lagerboard:sync";
const getCfg = () => { try { return JSON.parse(localStorage.getItem(CFGK) || "null"); } catch (e) { return null; } };
const setCfg = (c) => c ? localStorage.setItem(CFGK, JSON.stringify(c)) : localStorage.removeItem(CFGK);

/* Große Listen passen sonst nicht in das Speicherlimit (100 KB bei jsonbin).
   Gepackt schrumpfen 3000 Zeilen von rund 540 KB auf etwa 17 KB. */
const canZip = typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined";

async function zip(str) {
  const cs = new CompressionStream("gzip");
  const stream = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(cs);
  const buf = new Uint8Array(await new Response(stream).arrayBuffer());
  let bin = "";
  for (let i = 0; i < buf.length; i += 8192)
    bin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
  return btoa(bin);
}

async function unzip64(b64) {
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([buf]).stream().pipeThrough(ds);
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}

const store = {
  async get() {
    const c = getCfg();
    if (!c) {
      const v = localStorage.getItem(KEY);
      if (v === null) return null;
      return JSON.parse(v);
    }
    const r = await fetch("https://api.jsonbin.io/v3/b/" + c.bin + "/latest",
      { headers: { "X-Master-Key": c.key, "X-Bin-Meta": "false" } });
    if (!r.ok) throw new Error("Sync " + r.status);
    const j = await r.json();
    if (!j) return null;
    if (j.gz) return JSON.parse(await unzip64(j.gz));   /* gepackt */
    if (j.value) return JSON.parse(j.value);            /* alte Fassung */
    return null;
  },
  async set(obj) {
    const c = getCfg(), s = JSON.stringify(obj);
    if (!c) { localStorage.setItem(KEY, s); return; }
    const body = canZip ? { gz: await zip(s) } : { value: s };
    const payload = JSON.stringify(body);
    if (payload.length > 95000)
      throw new Error("zu groß (" + Math.round(payload.length / 1024) + " KB)");
    const r = await fetch("https://api.jsonbin.io/v3/b/" + c.bin, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": c.key },
      body: payload
    });
    if (!r.ok) throw new Error("Sync " + r.status);
  }
};

  imp: null,     /* laufender Lagerort-Import */
  kimp: null,    /* laufender KPI-Import */
  rev: 0
};
let saveTimer = null;

async function pull(force) {
  try {
    const remote = await store.get();
    if (remote) {
      const list = remote.drivers || [];
      if (list.length < 10) {
        for (let i = list.length; i < 10; i++)
          list.push({ id: uid(), name: "Fahrer " + (i + 1), area: "", note: "", at: 0 });
        remote.drivers = list;
      }
      if (force || (remote.rev || 0) > S.rev) { S.rev = remote.rev || 0; S.data = remote; }
    }
    S.lastPull = Date.now();
    S.sync = "idle";
  } catch (e) {
    S.sync = "error";
    console.warn("Laden fehlgeschlagen:", e.message);
  }
}

function commit(fn) {
  fn(S.data);
  S.data.rev = (S.data.rev || 0) + 1;
  S.rev = S.data.rev;
  S.sync = "saving";
  render();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await store.set(S.data); S.sync = "idle"; S.err = ""; }
    catch (e) { S.sync = "error"; S.err = e.message; }
    paintHeader();
  }, 400);
}

  if (i.skip) g = g.slice(1);

  if (i.pal) g = g.filter((r) => isPal(r.art));

/* ---------------- Reiter: Spezialprojekte ---------------- */
function viewProj() {
  const ps = S.data.projects || [];
  const all = ps.reduce((a, p) => a.concat(p.tasks), []);
  const done = all.filter((t) => t.done).length;
  const pct = all.length ? Math.round((done / all.length) * 100) : 0;
  const people = S.data.drivers.map((d) => d.name);

  const owners = [...new Set(all.map((t) => t.owner).filter(Boolean))].map((o) => ({
    o, done: all.filter((t) => t.owner === o && t.done).length,
    open: all.filter((t) => t.owner === o && !t.done).length
  })).sort((a, b) => (b.done + b.open) - (a.done + a.open));
  const mx = Math.max(1, ...owners.map((l) => l.done + l.open));

  const head = all.length ? '<section class="card pad">' +
    '<div class="row" style="align-items:baseline;gap:8px;margin-bottom:8px">' +
      '<span class="num" style="font-size:30px;font-weight:600">' + pct + '%</span>' +
      '<span class="muted">' + done + " von " + all.length + " Aufgaben erledigt</span></div>" +
    '<div class="bar"><i class="' + (pct === 100 ? "done" : "") + '" style="width:' + pct + '%"></i></div>' +
    (owners.length ? '<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">' +
      '<p class="up" style="margin:0 0 6px">Verteilung</p>' + owners.map((l) =>
      '<div class="row" style="margin-top:6px">' +
        '<span class="muted" style="width:96px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(l.o) + '</span>' +
        '<span style="flex:1;display:flex;height:16px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.05)">' +
          '<i style="width:' + (l.done / mx * 100) + '%;background:rgba(52,211,153,.7)"></i>' +
          '<i style="width:' + (l.open / mx * 100) + '%;background:rgba(34,211,238,.7)"></i></span>' +
        '<span class="tiny num" style="width:52px;text-align:right">' + l.done + "/" + (l.done + l.open) + "</span></div>").join("") +
      '<p class="tiny" style="margin:8px 0 0"><i class="dot" style="background:rgba(52,211,153,.7);display:inline-block"></i> erledigt' +
      ' &nbsp; <i class="dot" style="background:rgba(34,211,238,.7);display:inline-block"></i> offen</p></div>' : "") +
    '</section>' : "";

  const list = ps.map((p) => {
    const n = p.tasks.length, d = p.tasks.filter((t) => t.done).length;
    const pc = n ? Math.round((d / n) * 100) : 0;
    return '<section class="card">' +
      '<div class="pad" style="border-bottom:1px solid var(--line)">' +
        '<div class="row"><input class="inl" style="font-weight:600" value="' + esc(p.title) +
          '" placeholder="Projektname" data-prj="' + p.id + '" data-k="title" />' +
          '<button class="btn dan" data-delprj="' + p.id + '">' + ico("trash") + '</button></div>' +
        '<div class="wrapf" style="margin-top:8px;align-items:center">' +
          '<select class="f" style="width:auto;padding:6px 30px 6px 10px;font-size:14px" data-prj="' + p.id + '" data-k="owner">' +
            '<option value="">Verantwortlich —</option>' + people.map((x) =>
              '<option' + (p.owner === x ? " selected" : "") + '>' + esc(x) + "</option>").join("") + '</select>' +
          '<input type="date" class="f" style="width:auto;padding:6px 10px;font-size:14px;color-scheme:dark" value="' +
            esc(p.due) + '" data-prj="' + p.id + '" data-k="due" />' +
          PRIO.map((o) => '<button class="chip"' +
            (p.prio === o.id ? ' style="border-color:' + o.col + ';color:' + o.col + '"' : "") +
            ' data-prjprio="' + p.id + "|" + o.id + '">' + o.label + "</button>").join("") +
        '</div>' +
        '<div class="row" style="margin-top:10px"><span class="bar" style="flex:1"><i class="' +
          (pc === 100 ? "done" : "") + '" style="width:' + pc + '%"></i></span>' +
          '<span class="tiny num" style="width:72px;text-align:right">' + d + "/" + n + " · " + pc + '%</span></div>' +
      '</div>' +
      '<div class="divide">' + (n ? p.tasks.map((t) =>
        '<div class="row pad" style="padding:8px 12px">' +
          '<button class="chk ' + (t.done ? "on" : "") + '" data-task="' + p.id + "|" + t.id + '">' + ico("check") + '</button>' +
          '<input class="inl" style="font-size:14px' + (t.done ? ";color:var(--dim3);text-decoration:line-through" : "") +
            '" value="' + esc(t.text) + '" placeholder="Aufgabe" data-tsk="' + p.id + "|" + t.id + '" data-k="text" />' +
          '<select class="f" style="width:110px;flex:0 0 auto;padding:4px 24px 4px 8px;font-size:12px" data-tsk="' +
            p.id + "|" + t.id + '" data-k="owner"><option value="">—</option>' + people.map((x) =>
            '<option' + (t.owner === x ? " selected" : "") + '>' + esc(x) + "</option>").join("") + '</select>' +
          '<button class="iconbtn" data-deltask="' + p.id + "|" + t.id + '">' + ico("x") + '</button></div>').join("")
        : '<p class="pad muted">Noch keine Aufgaben.</p>') + '</div>' +
      '<div class="pad" style="border-top:1px solid var(--line)">' +
        '<button class="btn w" data-addtask="' + p.id + '">' + ico("plus") + 'Aufgabe hinzufügen</button></div>' +
    '</section>';
  }).join("");

  return '<div class="stack4">' + head + list +
    '<button class="dash" data-act="addprj">' + ico("plus") + 'Projekt anlegen</button></div>';
}

        '<button class="btn dan" data-act="kclear">' + ico("trash") + '</button></div>' +
    '</section></div>';

function kpiBuild() {
  const i = S.kimp;
  if (!i || i.cName === "") return null;
  const grid = i.sheets[i.si].grid.slice(1);
  const heads = i.sheets[i.si].grid[0] || [];
  const map = {};
  grid.forEach((r) => {
    const who = String(r[+i.cName] == null ? "" : r[+i.cName]).trim();
    if (!who) return;
    const v = i.cVal === "" ? 1 : num(r[+i.cVal]);
    const cat = i.cCat === "" ? "" : (String(r[+i.cCat] == null ? "" : r[+i.cCat]).trim() || "Ohne");
    if (!map[who]) map[who] = { name: who, sum: 0, rows: 0, cats: {} };
    map[who].sum += v; map[who].rows++;
    if (cat) map[who].cats[cat] = (map[who].cats[cat] || 0) + v;
  });
  const list = Object.keys(map).map((k) => map[k]).sort((a, b) => b.sum - a.sum);
  if (!list.length) return null;
  return { week: i.week.trim(), file: i.fname, at: Date.now(),
    unit: i.cVal === "" ? "Zeilen" : String(heads[+i.cVal] || "").trim() || "Menge",
    list, total: list.reduce((s, x) => s + x.sum, 0) };
}

/* ---------------- Reiter: Schott-Umlagerungen ---------------- */
function viewSchott() {
  const list = S.data.schott || [];
  const done = list.filter((r) => r.aus);
  const open = list.filter((r) => !r.aus);
  const pal = (rs) => rs.reduce((s, r) => s + num(r.pal), 0);

  const shown = S.fScho === "offen" ? open : S.fScho === "fertig" ? done : list;

  const tiles =
    '<button class="tile ' + (S.fScho === "" ? "on" : "") + '" data-fscho="">' +
      '<b>' + list.length + '</b><span>Einträge gesamt</span></button>' +
    '<button class="tile ' + (S.fScho === "offen" ? "on" : "") + '" data-fscho="offen">' +
      '<b>' + open.length + '</b><span><i class="dot" style="background:var(--am)"></i>Offen</span></button>' +
    '<button class="tile ' + (S.fScho === "fertig" ? "on" : "") + '" data-fscho="fertig">' +
      '<b>' + done.length + '</b><span><i class="dot" style="background:var(--em)"></i>Ausgelagert</span></button>' +
    '<div class="tile"><b>' + de(pal(list)) + '</b><span>Paletten gesamt</span></div>';

  /* Aufteilung nach Bereich in GiGu */
  const areas = [...new Set(list.map((r) => (r.gigu || "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "de"));
  const byArea = areas.length ? '<section class="card">' +
    '<div class="hd"><span class="up">Paletten nach Bereich in GiGu</span></div><div class="divide">' +
    areas.map((a) => {
      const rs = list.filter((r) => (r.gigu || "").trim() === a);
      const o = rs.filter((r) => !r.aus).length;
      return '<div class="row pad" style="padding:9px 12px">' +
        '<span style="flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;' +

        '<span class="num" style="font-weight:600;width:64px;text-align:right">' + de(pal(rs)) + '</span>' +
        '</div>';
    }).join("") + '</div></section>' : "";

  const rows = shown.map((r) =>
    '<tr>' +
      '<td><input class="inl" style="font-weight:500" value="' + esc(r.art) +
        '" placeholder="Artikel" data-scho="' + r.id + '" data-k="art" /></td>' +
      '<td><input class="inl num" value="' + esc(r.ort) +
        '" placeholder="Lagerort" data-scho="' + r.id + '" data-k="ort" /></td>' +
      '<td><input class="inl" style="color:var(--dim)" value="' + esc(r.gigu) +
        '" placeholder="Bereich" data-scho="' + r.id + '" data-k="gigu" /></td>' +
      '<td style="width:88px"><input class="inl num" style="text-align:right" value="' + esc(r.pal) +
        '" placeholder="0" inputmode="decimal" data-scho="' + r.id + '" data-k="pal" /></td>' +
      '<td style="width:150px"><input type="date" class="inl" style="color-scheme:dark;color:' +
        (r.aus ? "var(--em)" : "var(--dim3)") + '" value="' + esc(r.aus) +
        '" data-scho="' + r.id + '" data-k="aus" /></td>' +
      '<td><input class="inl" style="color:var(--dim)" value="' + esc(r.note || "") +
        '" placeholder="Notiz…" data-scho="' + r.id + '" data-k="note" /></td>' +
      '<td><button class="iconbtn" data-delscho="' + r.id + '">' + ico("x") + '</button></td>' +
    '</tr>').join("");

  return '<div class="stack">' +
    '<div class="grid4">' + tiles + '</div>' + byArea +
    '<div class="row"><span class="muted" style="flex:1">' +
      (S.fScho ? shown.length + " von " + list.length + " gezeigt · " + de(pal(shown)) + " Paletten"
               : list.length + " Umlagerungen erfasst") + '</span>' +
      (S.fScho ? '<button class="btn" data-act="clearscho">' + ico("x") + 'Filter zurücksetzen</button>' : "") +
    '</div>' +
    '<div class="tblwrap"><table><thead><tr>' +
      '<th>Artikel</th><th>Lagerort</th><th>Bereich in GiGu</th><th style="text-align:right">Paletten</th>' +
      '<th>Ausgelagert am</th><th>Notiz</th><th></th></tr></thead><tbody>' +

/* =========================================================================
   Ereignisse
   ========================================================================= */
const pick = (accept) => new Promise((res) => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept;
  inp.onchange = () => res(inp.files[0] || null);
  inp.click();
});

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, [data-tab]");
  if (!t) return;
  const g = (k) => t.getAttribute(k);

  if (g("data-tab")) { S.tab = g("data-tab"); render(); return; }

  const act = g("data-act");
  const sp = (v) => (v || "").split("|");

  /* Konsolidierungsplätze */
  if (act === "addapp") return commit((d) =>
    d.apps.push({ id: uid(), name: "Konsolidierungsplatz " + (d.apps.length + 1), slots: [] }));
  if (g("data-delapp")) return commit((d) => d.apps = d.apps.filter((a) => a.id !== g("data-delapp")));
  if (g("data-addslot")) return commit((d) =>
    d.apps.find((a) => a.id === g("data-addslot")).slots.push({ id: uid(), name: "", status: "frei", note: "" }));
  if (g("data-delslot")) { const [a, s] = sp(g("data-delslot"));
    return commit((d) => { const x = d.apps.find((y) => y.id === a); x.slots = x.slots.filter((y) => y.id !== s); }); }
  if (g("data-slotst")) { const [a, s, st] = sp(g("data-slotst"));
    return commit((d) => d.apps.find((y) => y.id === a).slots.find((y) => y.id === s).status = st); }

  /* Lagerorte */
  if (act === "addrow") return commit((d) => d.free.push({ id: uid(), ort: "", art: "",
    kapazitaet: "", bemerkung: "", status: "frei", src: "", srcAt: Date.now() }));
  if (g("data-delrow")) return commit((d) => d.free = d.free.filter((r) => r.id !== g("data-delrow")));
  if (g("data-rowst")) { const [id, st] = sp(g("data-rowst"));
    return commit((d) => { const r = d.free.find((x) => x.id === id); r.status = st; r.editAt = Date.now(); }); }
  if (g("data-fstatus")) { S.fStatus = S.fStatus === g("data-fstatus") ? "" : g("data-fstatus"); return render(); }
  if (g("data-fart")) { S.fArt = S.fArt === g("data-fart") ? "" : g("data-fart"); return render(); }
  if (act === "clearf") { S.fArt = S.fStatus = ""; return render(); }
  if (act === "delpfx") {
    const p = ($("#pfx").value || "").trim();
    if (!p) return;
    const n = S.data.free.filter((r) => String(r.ort || "").trim().indexOf(p) === 0).length;
    if (!n) return alert("Keine Treffer für " + p);
    if (!confirm(n + " Lagerorte mit " + p + " wirklich löschen?\nGilt für alle Geräte.")) return;
    return commit((d) => d.free = d.free.filter((r) => String(r.ort || "").trim().indexOf(p) !== 0));
  }
  if (act === "delnonpal") {
    const n = S.data.free.filter((r) => !isPal(r.art)).length;
    if (!confirm(n + " Plätze anderer Art wirklich löschen?\nGilt für alle Geräte.")) return;
    return commit((d) => d.free = d.free.filter((r) => isPal(r.art)));
  }

  /* Import Lagerorte */
  if (act === "pickfree") {
    const f = await pick(".xlsx,.xls,.csv");
    if (!f) return;
    try {
      const sheets = await readSpreadsheet(f);
      S.imp = { fname: f.name, sheets, si: 0, skip: true, pal: true, only: "" };
      render();
    } catch (err) { alert("Datei konnte nicht gelesen werden.\n" + err.message); }
    return;
  }
  if (act === "impcancel") { S.imp = null; return render(); }
  if (act === "impskip") { S.imp.skip = !S.imp.skip; S.imp.only = $("#imponly").value; return render(); }
  if (act === "imppal") { S.imp.pal = !S.imp.pal; S.imp.only = $("#imponly").value; return render(); }
  if (act === "impappend" || act === "impreplace") {
    S.imp.only = $("#imponly").value;
    const rows = impRows(), src = S.imp.fname, mode = act === "impreplace";
    if (mode && !confirm("Bestehende Tabelle durch " + rows.length + " Zeilen ersetzen?")) return;
    S.imp = null;
    return commit((d) => {
      const at = Date.now();
      const fresh = rows.map((r) => Object.assign({ id: uid(), src, srcAt: at }, r));
      d.free = mode ? fresh : d.free.concat(fresh);
    });
  }

  /* Stapler */
  if (g("data-area")) { const [id, a] = sp(g("data-area"));
    return commit((d) => { const x = d.drivers.find((y) => y.id === id); x.area = a; x.at = Date.now(); }); }

  /* Projekte */
  if (act === "addprj") return commit((d) => (d.projects = d.projects || []).push(
    { id: uid(), title: "", owner: "", due: "", prio: "normal", note: "", tasks: [] }));
  if (g("data-delprj")) return commit((d) => d.projects = d.projects.filter((p) => p.id !== g("data-delprj")));
  if (g("data-addtask")) return commit((d) =>
    d.projects.find((p) => p.id === g("data-addtask")).tasks.push({ id: uid(), text: "", owner: "", done: false }));
  if (g("data-deltask")) { const [p, tt] = sp(g("data-deltask"));
    return commit((d) => { const x = d.projects.find((y) => y.id === p); x.tasks = x.tasks.filter((y) => y.id !== tt); }); }
  if (g("data-task")) { const [p, tt] = sp(g("data-task"));
    return commit((d) => { const x = d.projects.find((y) => y.id === p).tasks.find((y) => y.id === tt); x.done = !x.done; }); }
  if (g("data-prjprio")) { const [p, pr] = sp(g("data-prjprio"));
    return commit((d) => d.projects.find((y) => y.id === p).prio = pr); }

  /* KPI */
  if (act === "pickkpi") {
    const f = await pick(".xlsx,.xls,.csv");
    if (!f) return;
    try {
      const sheets = await readSpreadsheet(f);
      S.kimp = { fname: f.name, sheets, si: 0, week: "", cName: "", cVal: "", cCat: "" };
      render();
    } catch (err) { alert("Datei konnte nicht gelesen werden.\n" + err.message); }
    return;
  }
  if (act === "kcancel") { S.kimp = null; return render(); }
  if (act === "ksave") {
    S.kimp.week = $("#kweek").value;
    const res = kpiBuild();
    S.kimp = null;
    return commit((d) => d.kpi = res);
  }
  if (act === "kclear") {
    if (!confirm("Auswertung löschen?")) return;
    return commit((d) => d.kpi = null);
  }

  /* Schott-Umlagerungen */
  if (act === "addscho") return commit((d) => (d.schott = d.schott || []).unshift(
    { id: uid(), art: "", ort: "", gigu: "", pal: "", aus: "", note: "" }));
  if (g("data-delscho")) return commit((d) => d.schott = d.schott.filter((r) => r.id !== g("data-delscho")));
  if (t.hasAttribute("data-fscho")) { S.fScho = g("data-fscho"); return render(); }
  if (act === "clearscho") { S.fScho = ""; return render(); }

  /* Bereiche */
  if (act === "addarea") {
    const v = ($("#newarea").value || "").trim();
    if (!v || S.data.areas.indexOf(v) > -1) return;
    return commit((d) => d.areas.push(v));
  }
  if (g("data-delarea")) return commit((d) => d.areas = d.areas.filter((a) => a !== g("data-delarea")));

  /* Sync */
  if (act === "syncon") {
    const bin = ($("#sbin").value || "").trim(), key = ($("#skey").value || "").trim();
    if (!bin || !key) { $("#syncmsg").textContent = "Beide Felder ausfüllen."; return; }
    $("#syncmsg").textContent = "Wird geprüft…";
    setCfg({ bin, key });
    try { await store.get(); location.reload(); }
    catch (err) { setCfg(null); $("#syncmsg").textContent = "Verbindung fehlgeschlagen. Daten prüfen."; }
    return;
  }
  if (act === "syncoff") { if (confirm("Sync trennen?")) { setCfg(null); location.reload(); } return; }
  if (act === "refresh") { await pull(true); render(); return; }
});

/* Texteingaben */
document.addEventListener("input", (e) => {
  const el = e.target, k = el.getAttribute("data-k");
  const set = (fn) => {
    fn(S.data);
    S.data.rev = (S.data.rev || 0) + 1; S.rev = S.data.rev;
    S.sync = "saving"; paintHeader();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await store.set(S.data); S.sync = "idle"; S.err = ""; }
      catch (x) { S.sync = "error"; S.err = x.message; }
      paintHeader();
    }, 600);
  };
  const sp = (v) => (v || "").split("|");

  if (el.getAttribute("data-app")) return set((d) =>
    d.apps.find((a) => a.id === el.getAttribute("data-app"))[k] = el.value);
  if (el.getAttribute("data-slot")) { const [a, s] = sp(el.getAttribute("data-slot"));
    return set((d) => d.apps.find((x) => x.id === a).slots.find((x) => x.id === s)[k] = el.value); }
  if (el.getAttribute("data-row")) return set((d) => {
    const r = d.free.find((x) => x.id === el.getAttribute("data-row"));
    r[k] = el.value; r.editAt = Date.now();
  });
  if (el.getAttribute("data-drv")) return set((d) => {
    const x = d.drivers.find((y) => y.id === el.getAttribute("data-drv"));
    x[k] = el.value; if (k === "note") x.at = Date.now();
  });
  if (el.getAttribute("data-scho")) return set((d) =>
    d.schott.find((r) => r.id === el.getAttribute("data-scho"))[k] = el.value);
  if (el.getAttribute("data-prj")) return set((d) =>
    d.projects.find((p) => p.id === el.getAttribute("data-prj"))[k] = el.value);
  if (el.getAttribute("data-tsk")) { const [p, tt] = sp(el.getAttribute("data-tsk"));
    return set((d) => d.projects.find((x) => x.id === p).tasks.find((x) => x.id === tt)[k] = el.value); }
});

/* Auswahlfelder im Import */
document.addEventListener("change", (e) => {
  /* Datumsfeld und Auswahlfelder lösen kein input aus -> hier nachziehen */
  const el = e.target;
  if (el.getAttribute("data-scho") || el.getAttribute("data-prj") || el.getAttribute("data-tsk")) {
    el.dispatchEvent(new Event("input", { bubbles: true }));
    setTimeout(render, 0);
    return;
  }
  const a = el.getAttribute("data-act");
  if (!a) return;
  if (a === "impsheet") { S.imp.si = +e.target.value; return render(); }
  if (a === "ksheet") { S.kimp.si = +e.target.value; S.kimp.cName = S.kimp.cVal = S.kimp.cCat = ""; return render(); }
  if (a === "kname") { S.kimp.week = $("#kweek").value; S.kimp.cName = e.target.value; return render(); }
  if (a === "kval")  { S.kimp.week = $("#kweek").value; S.kimp.cVal  = e.target.value; return render(); }
  if (a === "kcat")  { S.kimp.week = $("#kweek").value; S.kimp.cCat  = e.target.value; return render(); }
});

/* =========================================================================
   Start
   ========================================================================= */
(async function () {
  await pull(true);
  S.loaded = true;
  render();
  setInterval(() => { S.now = Date.now(); if (S.tab === "free" || S.tab === "kpi") render(); }, 60000);
  setInterval(async () => {
    if (!getCfg()) return;                 /* ohne Sync kein Abgleich nötig */
    if (S.imp || S.kimp) return;           /* nicht während eines Imports */
    if (document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
    const before = S.rev;
    await pull(false);
    if (S.rev !== before) render();
  }, 5000);
})();
</script>
